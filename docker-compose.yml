services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport -d transport_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "true"
      SECRET_KEY: dev-secret-key-change-in-production-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:5173"
      DATABASE_URL: postgresql+asyncpg://transport:transport@db:5432/transport_db
      REDIS_URL: redis://redis:6379/0
      SUPERADMIN_PASSWORD: Admin@123456
      SEED_PASSWORD: Password123!
      MQTT_BROKER_URL: mqtt
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: smart-transport-backend
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      # Bootstrap service token — shared with gps_service.
      GPS_SERVICE_TOKEN: ${GPS_SERVICE_TOKEN}
      GPS_SERVICE_TENANT_ID: ${GPS_SERVICE_TENANT_ID:-ten-demo-001}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started

  gps_service:
    build:
      context: .
      dockerfile: gps_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      BACKEND_BASE_URL: http://backend:8000
      BACKEND_SERVICE_TOKEN: ${GPS_SERVICE_TOKEN}
      BACKEND_REQUEST_TIMEOUT: "10"
      BACKEND_PAGE_SIZE: "50"
      DEVICE_ID_PREFIX: "sim-"
      MQTT_BROKER_URL: mqtt
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: gps-service
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_RETRY_ATTEMPTS: "3"
      MQTT_RETRY_DELAY: "2"
      POLL_INTERVAL: "5"
      VEHICLE_REFRESH_INTERVAL: "30"
      SIMULATION_MODE: "true"
      API_HOST: "0.0.0.0"
      API_PORT: "8001"
    depends_on:
      backend:
        condition: service_healthy
      mqtt:
        condition: service_started
  passenger_service:
    build:
      context: .
      dockerfile: passenger_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      BACKEND_BASE_URL: http://backend:8000
      BACKEND_SERVICE_TOKEN: ${GPS_SERVICE_TOKEN}
      BACKEND_REQUEST_TIMEOUT: "10"
      BACKEND_PAGE_SIZE: "50"
      MQTT_BROKER_URL: mqtt
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: passenger-service
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_RETRY_ATTEMPTS: "3"
      MQTT_RETRY_DELAY: "2"
      VEHICLE_REFRESH_INTERVAL: "30"
      API_HOST: "0.0.0.0"
      API_PORT: "8002"
    depends_on:
      backend:
        condition: service_healthy
      mqtt:
        condition: service_started
volumes:
  pgdata:
  mqtt_data:
  mqtt_log:
